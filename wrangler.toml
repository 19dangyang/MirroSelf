# 仓库根目录的 Worker 配置。
#
# 放在根目录的原因：Cloudflare 的「从 Git 仓库创建 Worker」会在**仓库根**执行
# `npx wrangler deploy`，而配置原来只放在 m4/ 里，根目录找不到 → 部署直接失败。
#
# 本地也可以直接在仓库根跑：npx wrangler deploy
# 如果只想跑 m4 目录：cd m4 && npx wrangler deploy --config ../wrangler.toml

name = "mirroself-api"
main = "m4/worker.js"
compatibility_date = "2025-01-01"

# KV 的地址与 token 不要写在这里（会进 git）。
# Git 部署不会执行 `wrangler secret put`，必须在
# Workers 控制台 → 你的 Worker → 设置 → 变量和机密 → 添加「机密」：
#   KV_REST_API_URL   = Upstash 的 REST URL
#   KV_REST_API_TOKEN = Upstash 的 REST Token
